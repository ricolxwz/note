theme:
  name: material
  logo_light_mode: https://cdn.ricolxwz.asia/favicon-black-mc-be1517f676f6767b821a61dee1fe0de1.svg
  logo_dark_mode: https://cdn.ricolxwz.asia/favicon-white-mc-9874bcbf2890db92e65db16e14c4edb4.svg
  language: zh
  custom_dir: overrides
  font: false
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.footnote.tooltips
    - content.tooltips
    - content.action.edit
    - content.action.view
    # - header.autohide
    # - announce.dismiss
    # - navigation.footer
    - navigation.tabs
    - navitation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  # font:
  #   text: "Roboto"
  #   code: "Ubuntu Mono"
  icon:
    annotation: material/star-four-points-circle
    repo: fontawesome/brands/github
    # admonition:
    #   note: octicons/tag-16
    #   abstract: octicons/checklist-16
    #   info: octicons/info-16
    #   tip: octicons/squirrel-16
    #   success: octicons/check-16
    #   question: octicons/question-16
    #   warning: octicons/alert-16
    #   failure: octicons/x-circle-16
    #   danger: octicons/zap-16
    #   bug: octicons/bug-16
    #   example: octicons/beaker-16
    #   quote: octicons/quote-16
extra:
  social:
    - icon: fontawesome/mug-hot-solid
      link: https://buymeacoffee.com/ricolxwz
    - icon: fontawesome/compass-solid
      link: https://ricolxwz.cc
    - icon: fontawesome/brands/github
