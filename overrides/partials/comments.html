{% if page.meta.comments %}
<h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
<!-- Insert generated snippet here -->
<script src="https://giscus.app/client.js" data-repo="ricolxwz/giscus" data-repo-id="R_kgDOOMYWuA"
    data-category="Announcements" data-category-id="DIC_kwDOOMYWuM4CoUAd" data-mapping="pathname" data-strict="0"
    data-reactions-enabled="1" data-emit-metadata="1" data-input-position="top" data-theme="preferred_color_scheme"
    data-lang="zh-CN" data-loading="lazy" crossorigin="anonymous" async></script>

<!-- Synchronize Giscus theme with palette -->
<script>
    var giscus = document.querySelector("script[src*=giscus]");

    // Set palette on initial load
    var palette = __md_get("__palette");
    if (palette && typeof palette.color === "object") {
        var theme =
            palette.color.scheme === "slate"
                ? "https://cdn.ricolxwz.asia/comments-dark-c486670a53fb62e1872348c73697e267.css"
                : "https://cdn.ricolxwz.asia/comments-light-b7735109fb99c4cdd50eaa005ef5aead.css";

        // Instruct Giscus to set theme
        giscus.setAttribute("data-theme", theme);
    }

    // Register event handlers after documented loaded
    document.addEventListener("DOMContentLoaded", function () {
        var ref = document.querySelector("[data-md-component=palette]");
        ref.addEventListener("change", function () {
            var palette = __md_get("__palette");
            if (palette && typeof palette.color === "object") {
                var theme =
                    palette.color.scheme === "slate"
                        ? "https://cdn.ricolxwz.asia/comments-dark-c486670a53fb62e1872348c73697e267.css"
                        : "https://cdn.ricolxwz.asia/comments-light-b7735109fb99c4cdd50eaa005ef5aead.css";

                // Instruct Giscus to change theme
                var frame = document.querySelector(".giscus-frame");
                frame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme } } },
                    "https://giscus.app",
                );
            }
        });
    });
</script>
{% endif %}
