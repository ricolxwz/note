stages:
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: 1

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip
    - .cache/wheels
    - .venv

pages:
  stage: deploy
  image: python:3.12-slim

  before_script:
    - python -V
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip config set global.cache-dir "$PIP_CACHE_DIR"

  script:
    # 第一次构建生成wheel并缓存. 后续直接从wheel安装
    - pip wheel -r requirements.txt -w .cache/wheels --disable-pip-version-check --no-compile
    - pip install --no-index --find-links=.cache/wheels -r requirements.txt --disable-pip-version-check --no-compile
    - mkdocs build --site-dir public

  artifacts:
    paths:
      - public
    expire_in: 1 week

  rules:
    # 仅默认分支且文档相关改动才运行
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - docs/**/*.{md,markdown}
        - mkdocs.yml
        - mkdocs.yaml
        - requirements.txt

